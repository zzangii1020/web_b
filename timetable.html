<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시간표</title>
    <style>
        table {
            border-collapse: collapse !important; /* 테두리 겹침 방지 */
            width: 40%;
            text-align: center;
        }
        th, td {
            border: 1px solid black !important;
            padding: 5px;
        }

        tr {
            height: 40px; color : darkblue; background-color: beige;
        }
        thead tr {
            background-color: aquamarine;
        }
        tfoot tr {
            background-color: dimgray;
        }

        h1 { color : purple;} /* 태그 선택자 */
        .a1 { background-color : yellow;}
        .b1 { background-color : lightgreen;}
        .c1 { background-color : lightcoral;}
        .d1 { background-color : lightpink;}
        .e1 { background-color : lightskyblue;}
        .f1 { background-color : lightslategray;}
        .g1 { background-color : lightseagreen;}
        .h1 { background-color : lightsalmon;}

    </style>
</head>
<body>
    <h1>시간표</h1>
    <table>
        <thead>
            <tr>
                <th style="color: red;">월</th>
                <th style="color: rgb(182, 182, 34);">화</th>
                <th style="color: green;">수</th>
                <th style="color: blue;">목</th>
                <th style="color: purple;">금</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td rowspan="9">&nbsp;</td>
                <td rowspan="4" class="a1">소자제작실습1</td>
                <td>&nbsp;</td>
                <td rowspan="5">&nbsp;</td>
                <td rowspan="5">&nbsp;</td>
            </tr>
            <tr>
                <td class="h1">채플</td>

            </tr>
            <tr>
                <td rowspan="2" class="b1">역사와 문화</td>
            </tr>
            <tr>
               
            </tr>
            <tr>
                <td>&nbsp;</td>
                <td>&nbsp;</td>
            </tr>
            <tr>
                <td rowspan="3" class="c1">웹프로그래밍</td>
                <td rowspan="3" class="d1">경제학원론</td>
                <td rowspan="3" class="e1">AI반도체 공정</td>
                <td rowspan="3" class="f1">재무분석</td>
            </tr>
            <tr>
               
            </tr>
            <tr>
                
            </tr>

            <tr>
                <td class="g1">인생설계와 진로2</td>
                <td>&nbsp;</td>
                <td>&nbsp;</td>
                <td>&nbsp;</td>
            </tr>
            
             
        </tbody>

        <tfoot>
            <tr>
                <td>꼬리1</td>
                <td>꼬리2</td>
                <td>꼬리3</td>
                <td>꼬리4</td>
                <td>꼬리5</td>
               
            </tr>
        </tfoot>
    </table>
    
</body>
</html>
