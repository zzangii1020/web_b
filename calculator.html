<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산기</title>
<style>
    h1 {text-align:center;}
    .ver {text-align:center; color:#999; font-size:11px; margin-top:-10px;}
    .disp { width : 205px; height:40px; margin-top:3px; box-sizing: content-box;}
    .disp {text-align: right; font-family:"Oxanium", sans-serif; font-size: 22pt;}
    #disp1 {font-size: 12pt; height: 24px; color: #777;}

    input[type=button] {width: 50px; height: 50px; margin-top: 5px;
           text-align: center; vertical-align: middle; }
    #calc {width: 220px; margin-left: auto; margin-right: auto;}
</style>
</head>
<body>
    <h1>계산기</h1>
    <p class="ver">v3</p>
    <div id="calc">
        <div>
            <input type="text" class="disp" id="disp1" readonly>
            <input type="text" class="disp" id="disp2" readonly>
        </div>
        <input type="button" class="num" value="7">
        <input type="button" class="num" value="8">
        <input type="button" class="num" value="9">
        <input type="button" class="op" value="+"> <br>
        <input type="button" class="num" value="4">
        <input type="button" class="num" value="5">
        <input type="button" class="num" value="6">
        <input type="button" class="op" value="-"> <br>
        <input type="button" class="num" value="1">
        <input type="button" class="num" value="2">
        <input type="button" class="num" value="3">
        <input type="button" class="op" value="*"> <br>
        <input type="button" id="ac" value="AC">
        <input type="button" class="num" value="0">
        <input type="button" id="eq" value="=">
        <input type="button" class="op" value="/"> <br>
    </div>

<script>
    // ----- 상태 -----
    let expr = "";              // 지금 입력 중인 수식 (예: "12+3*2")
    let justCalculated = false; // 방금 = 을 눌러서 결과가 표시된 상태인지

    const disp1 = document.getElementById("disp1");  // 위: 계산한 수식
    const disp2 = document.getElementById("disp2");  // 아래: 입력 중 수식 / 결과

    function isOp(c){ return c == "+" || c == "-" || c == "*" || c == "/"; }

    function show(){ disp2.value = expr; }

    // ----- eval 없이 수식 계산 -----
    function calculate(s){
        let nums = [], ops = [], numStr = "";
        for(let i = 0; i < s.length; i++){
            let c = s[i];
            // 맨 앞 '-' 또는 연산자 바로 뒤 '-'는 음수 부호
            if(c == "-" && numStr == "" && (i == 0 || isOp(s[i - 1]))){
                numStr += c;
            }
            else if(isOp(c)){
                nums.push(Number(numStr));
                ops.push(c);
                numStr = "";
            }
            else{
                numStr += c;
            }
        }
        nums.push(Number(numStr));

        // *, / 먼저
        let nums2 = [nums[0]], ops2 = [];
        for(let i = 0; i < ops.length; i++){
            let b = nums[i + 1];
            if(ops[i] == "*") nums2[nums2.length - 1] *= b;
            else if(ops[i] == "/"){
                if(b == 0) return NaN;
                nums2[nums2.length - 1] /= b;
            }
            else { ops2.push(ops[i]); nums2.push(b); }
        }
        // +, - 나중
        let result = nums2[0];
        for(let i = 0; i < ops2.length; i++){
            if(ops2[i] == "+") result += nums2[i + 1];
            else result -= nums2[i + 1];
        }
        return Number(result.toPrecision(12));   // 0.1+0.2 같은 오차 제거
    }

    // ----- 버튼 동작 -----
    function pressNum(n){
        if(justCalculated){            // 결과 뒤에 숫자 → 새 계산
            expr = "";
            disp1.value = "";
            justCalculated = false;
        }
        expr += n;
        show();
    }

    function pressOp(o){
        justCalculated = false;        // 결과 뒤에 연산자 → 결과에 이어서 계산
        if(expr == ""){
            if(o == "-") expr = "-";   // 음수로 시작만 허용
            show();
            return;
        }
        let last = expr.slice(-1);
        if(isOp(last)){
            if(o == "-" && last != "-"){
                expr += o;             // 5*-3 처럼 음수 부호
            } else {
                while(expr != "" && isOp(expr.slice(-1))) expr = expr.slice(0, -1);
                if(expr != "") expr += o;   // 연산자 교체
            }
        } else {
            expr += o;
        }
        show();
    }

    function pressEq(){
        let s = expr;
        while(s != "" && isOp(s.slice(-1))) s = s.slice(0, -1);   // 끝 연산자 제거
        if(s == "") return;

        let result = calculate(s);
        disp1.value = s + " =";        // 위 칸: 계산한 수식
        if(!isFinite(result)){
            disp2.value = "오류";
            expr = "";
        } else {
            // 지수 표기(1e+21) 대신 일반 숫자로
            expr = result.toLocaleString("en-US", {useGrouping: false, maximumFractionDigits: 10});
            disp2.value = expr;        // 아래 칸: 결과만
        }
        justCalculated = true;
    }

    function pressAC(){
        expr = "";
        justCalculated = false;
        disp1.value = "";
        disp2.value = "";
    }

    // ----- 이벤트 연결 (jQuery 없이) -----
    document.querySelectorAll(".num").forEach(function(btn){
        btn.addEventListener("click", function(){ pressNum(btn.value); });
    });
    document.querySelectorAll(".op").forEach(function(btn){
        btn.addEventListener("click", function(){ pressOp(btn.value); });
    });
    document.getElementById("eq").addEventListener("click", pressEq);
    document.getElementById("ac").addEventListener("click", pressAC);

    // 키보드 입력도 지원
    document.addEventListener("keydown", function(e){
        if(/^[0-9]$/.test(e.key)) pressNum(e.key);
        else if(isOp(e.key)) pressOp(e.key);
        else if(e.key == "Enter" || e.key == "="){ e.preventDefault(); pressEq(); }
        else if(e.key == "Escape" || e.key == "Backspace") pressAC();
    });
</script>
</body>
</html>
